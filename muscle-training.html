<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthCal — Muscle Training</title>
  <link rel="stylesheet" href="css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="brand">
      <h1>HealthCal</h1>
    </div>
    <nav class="nav">
      <a class="button" href="index.html">Home</a>
      <a class="button" href="all-page.html">All tools</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-left">
        <h2>Muscle training</h2>
        <p>Choose a muscle group to get two exercise recommendations, then save the exercises you complete.</p>
        <div class="cta-row">
          <a class="cta primary" href="index.html">Back to Home</a>
          <a class="cta" href="all-page.html">All tools</a>
        </div>
      </div>
    </section>

    <section class="leaderboard-preview">
      <h3>Choose a muscle group</h3>
      <form id="muscle-training-form">
        <label for="muscle-group">Muscle to train</label>
        <select id="muscle-group" name="muscle-group" required>
          <option value="">Select a muscle</option>
          <option value="chest">Chest</option>
          <option value="leg">Leg</option>
          <option value="biceps">Biceps</option>
        </select>
        <button class="cta primary" type="submit">Get recommendations</button>
      </form>

      <h3 id="recommendation-heading">Exercise recommendations</h3>
      <table aria-label="Recommended exercises">
        <thead>
          <tr><th scope="col">Exercise</th><th scope="col">Completed</th></tr>
        </thead>
        <tbody id="exercise-table-body">
          <tr><td colspan="2">Choose a muscle group to see recommendations.</td></tr>
        </tbody>
      </table>
      <button class="cta primary" id="submit-exercises" type="button" disabled>Save completed exercises</button>
      <p id="exercise-submit-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/muscle-training.js"></script>
</body>
</html>
